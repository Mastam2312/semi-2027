function havKm(lat1,lon1,lat2,lon2){
  const R=6371,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return m+":"+String(s).padStart(2,"0");
}

async function importGpx(ev){
  const file=ev&&ev.target&&ev.target.files&&ev.target.files[0];
  if(!file)return;
  try{
    const txt=await file.text();
    const doc=new DOMParser().parseFromString(txt,"application/xml");
    if(doc.querySelector("parsererror"))return toast("Fichier GPX invalide");
    let pts=Array.from(doc.querySelectorAll("trkpt"));
    if(!pts.length)pts=Array.from(doc.querySelectorAll("rtept"));
    if(pts.length<2)return toast("Pas assez de points GPS dans le GPX");

    let distKm=0,prev=null,minTs=null,maxTs=null;
    for(const pt of pts){
      const lat=parseFloat(pt.getAttribute("lat")),lon=parseFloat(pt.getAttribute("lon"));
      if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;
      const tEl=pt.querySelector("time");
      if(tEl&&tEl.textContent){
        const ms=Date.parse(tEl.textContent.trim());
        if(Number.isFinite(ms)){
          if(minTs===null||ms<minTs)minTs=ms;
          if(maxTs===null||ms>maxTs)maxTs=ms;
        }
      }
      if(prev)distKm+=havKm(prev.lat,prev.lon,lat,lon);
      prev={lat,lon};
    }

    const dInput=$("#f_d"),tInput=$("#f_t"),rInput=$("#f_r"),oInput=$("#f_o");
    if(dInput&&distKm>0)dInput.value=distKm.toFixed(2);
    if(tInput&&minTs!==null&&maxTs!==null&&maxTs>minTs){
      tInput.value=fmtDur((maxTs-minTs)/1000);
    }
    if(oInput)oInput.checked=true;
    if(rInput&&!rInput.value.trim())rInput.value="Import GPX : "+file.name;
    lp();
    toast("GPX importé ("+distKm.toFixed(2)+" km)");
  }catch(e){
    toast("Lecture du GPX impossible");
  }finally{
    ev.target.value="";
  }
}

function parseWorkoutSteps(r){
  const desc=String(r[4]||""),pace=String(r[6]||""),totalKm=r[5]||null;
  const repMatch=desc.match(/dont\s+(\d+)\s*[×x]\s*(\d+)\s*min\s+(.+)/i);
  if(repMatch){
    const reps=parseInt(repMatch[1],10);
    const workMin=parseInt(repMatch[2],10);
    const workLabel=repMatch[3].trim();
    const paceParts=pace.split(";");
    const workPace=(paceParts[1]||paceParts[0]||pace).trim();
    const efPace=(paceParts[0]||"6’45–7’30/km").trim();
    const steps=[
      {type:"Échauffement",detail:"10 min très faciles ("+efPace+") · FC < 155",durationSec:600,distanceM:null},
      {type:"Bloc rapide ("+reps+"×)",detail:workMin+" min "+workLabel+" ("+workPace+")",durationSec:workMin*60,distanceM:null,repeats:reps},
      {type:"Récupération",detail:"2 min trot très lent / marche entre chaque bloc",durationSec:120,distanceM:null},
      {type:"Retour au calme",detail:"5–10 min faciles ("+efPace+")",durationSec:420,distanceM:null}
    ];
    return{title:"S"+r[0]+" · "+workLabel,summary:desc+" ("+pace+")",steps};
  }
  const minMatch=desc.match(/(\d+)\s*min\s+(.+)/i);
  if(minMatch && !totalKm){
    const mins=parseInt(minMatch[1],10);
    return{
      title:"S"+r[0]+" · "+minMatch[2].trim(),
      summary:desc+" ("+pace+")",
      steps:[
        {type:"Footing facile",detail:mins+" min "+minMatch[2].trim()+" ("+pace+") · FC < 155",durationSec:mins*60,distanceM:null}
      ]
    };
  }
  const kmVal=totalKm||10;
  return{
    title:"S"+r[0]+" · "+(totalKm?totalKm+" km":"Séance"),
    summary:desc+" ("+pace+")",
    steps:[
      {type:"Course principale",detail:desc+" ("+pace+")",durationSec:null,distanceM:Math.round(kmVal*1000)}
    ]
  };
}

function crc16Fit(bytes){
  const table=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
  let crc=0;
  for(const b of bytes){
    let tmp=table[crc&0xF];
    crc=(crc>>4)&0x0FFF;
    crc=crc^tmp^table[b&0xF];
    tmp=table[crc&0xF];
    crc=(crc>>4)&0x0FFF;
    crc=crc^tmp^table[(b>>4)&0xF];
  }
  return crc;
}

function pushU16(arr,v){arr.push(v&0xFF,(v>>8)&0xFF)}
function pushU32(arr,v){arr.push(v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>24)&0xFF)}
function pushStr(arr,str,len){
  const enc=new TextEncoder().encode(String(str||""));
  for(let i=0;i<len;i++)arr.push(i<enc.length?enc[i]:0);
}

function buildBipFit(r){
  const w=parseWorkoutSteps(r);
  const body=[];
  const fitEpoch=Date.UTC(1989,11,31,0,0,0)/1000;
  const nowFit=Math.max(0,Math.floor(Date.now()/1000-fitEpoch));

  body.push(0x00,0x00,0x00,0x00,0x06,
    0,1,0,
    1,2,132,
    2,2,132,
    3,4,140,
    4,4,134,
    5,2,132
  );
  body.push(0x00,5);
  pushU16(body,1);
  pushU16(body,1);
  pushU32(body,1001);
  pushU32(body,nowFit);
  pushU16(body,0);

  body.push(0x41,0x00,26,0x00,0x03,
    4,20,7,
    5,1,0,
    6,2,132
  );
  body.push(0x01);
  pushStr(body,w.title.slice(0,19),20);
  body.push(1);
  pushU16(body,w.steps.length);

  body.push(0x42,0x00,27,0x00,0x06,
    254,2,132,
    0,16,7,
    1,1,0,
    2,4,134,
    3,1,0,
    7,1,0
  );

  w.steps.forEach((s,idx)=>{
    const isDist=!s.durationSec && !!s.distanceM;
    const durType=isDist?1:0;
    const durVal=isDist?Math.round((s.distanceM||1000)*100):Math.round((s.durationSec||300)*1000);
    const intensity=/rapide|soutenu|active|semi/i.test(s.type)?0:1;
    body.push(0x02);
    pushU16(body,idx);
    pushStr(body,s.type.slice(0,15),16);
    body.push(durType);
    pushU32(body,durVal);
    body.push(0);
    body.push(intensity);
  });

  const headerSize=14;
  const header=[];
  header.push(headerSize);
  header.push(0x20);
  pushU16(header,2100);
  pushU32(header,body.length);
  header.push(46,70,73,84);
  pushU16(header,crc16Fit(header));

  const crcBody=crc16Fit(body);
  const out=[...header,...body];
  pushU16(out,crcBody);
  return new Uint8Array(out);
}

function downloadBipFit(n){
  const r=findSess(n);
  if(!r)return;
  try{
    const bytes=buildBipFit(r);
    const blob=new Blob([bytes],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="Amazfit_Bip6_Seance_"+String(n)+".fit";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },1000);
    toast("Fichier .fit téléchargé");
  }catch(e){
    toast("Export .fit impossible");
  }
}

function renderBipBoxContent(n){
  const arg=typeof n=="number"?n:"'"+n+"'";
  const r=findSess(n);
  const box=$("#bip-box");
  if(!r||!box)return;
  const w=parseWorkoutSteps(r);
  box.innerHTML=`
    <div style="font-size:13.5px;font-weight:600;margin-bottom:4px">Transcription Amazfit Bip 6 · ${esc(w.title)}</div>
    <div class="mut" style="font-size:12px;margin-bottom:8px">Télécharge le fichier .fit d’entraînement, copie les étapes pour Zepp ou exporte en .tcx.</div>
    ${w.steps.map((s,idx)=>`<div class="bip-step"><b>${idx+1}. ${esc(s.type)}${s.repeats?" (×"+s.repeats+")":""}</b><br><span class="mut">${esc(s.detail)}</span></div>`).join("")}
    <div class="bip-actions">
      <button type="button" class="btn" onclick="copyBipWorkout(${arg})">Copier Zepp</button>
      <button type="button" class="btn s" style="color:var(--tx);border-color:var(--ln)" onclick="downloadBipFit(${arg})">Fichier .fit</button>
      <button type="button" class="btn s" style="color:var(--tx);border-color:var(--ln)" onclick="downloadBipTcx(${arg})">Fichier .tcx</button>
    </div>`;
  box.style.display="block";
}

function toggleBipBox(n){
  const box=$("#bip-box");
  if(!box)return;
  if(box.style.display==="block"){
    box.style.display="none";
    return;
  }
  renderBipBoxContent(n);
}

async function copyBipWorkout(n){
  const r=findSess(n);
  if(!r)return;
  const txt=buildBipText(r);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
    }else{
      const ta=document.createElement("textarea");
      ta.value=txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast("Séance Bip 6 copiée");
  }catch(e){
    toast("Copie impossible sur cet appareil");
  }
}

function downloadBipTcx(n){
  const r=findSess(n);
  if(!r)return;
  try{
    const xml=buildBipTcx(r);
    const blob=new Blob([xml],{type:"application/vnd.garmin.tcx+xml"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="Amazfit_Bip6_Seance_"+String(n)+".tcx";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },1000);
    toast("Fichier .tcx téléchargé");
  }catch(e){
    toast("Export .tcx impossible");
  }
}

    <div class="grabber"></div>

    <p class="mut" style="margin:0 0 12px">${esc(r[4])}</p>
    <div style="background:var(--bg);border:1px dashed var(--ln);border-radius:14px;padding:12px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>

    <label>Remarques</label>

function lp(){const d=+$("#f_d").value,s=secs($("#f_t").value);$("#f_p").textContent=d>0&&s>0?"Allure calculée : "+fp(s/d)+" /km":""}
function closeLog(){$("#sheet").classList.remove("on")}
function saveLog(n){S.log[n]={d:$("#f_d").value,t:$("#f_t").value,s:$("#f_s").value,p:$("#f_q").value,r:$("#f_r").value,ok:$("#f_o").checked||+$("#f_d").value>0};save();closeLog();render();toast("Séance enregistrée")}

function buildWorkbook(){
  const H=["N°","Semaine","Date prévue","Séance","Contenu prévu","Distance prévue (km)","Allure cible","Distance réalisée (km)","Temps réalisé (hh:mm:ss)","Allure réelle (min/km)","Sensations (1–5)","Douleur","Récupération / remarques","Séance effectuée ?"];
  const expList=[...D,...OPT_FRI.filter(r=>isDone(r[0]))];
  const rows=expList.map(r=>{
    const l=L(r[0]),s=secs(l.t),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;
    return[
      r[0],
      r[1],
      pd(r[2]),
      r[3],
      r[4],
      r[5]??"",
      r[6],
      l.d?+l.d:"",
      s?[h,m,c].map(x=>String(x).padStart(2,"0")).join(":"):"",
      pc(r[0])?fp(pc(r[0])):"",
      l.s||"",
      l.p||"",
      l.r||"",
      isDone(r[0])?"Oui":""
    ];
  });
  const ws=XLSX.utils.aoa_to_sheet([H,...rows],{cellDates:true});
  rows.forEach((_,i)=>{const c=ws["C"+(i+2)];if(c)c.z="dd/mm/yyyy"});
  ws["!cols"]=[6,9,13,12,46,12,34,14,18,16,16,12,34,14].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Suivi des séances");
  return wb;
}

  try{

let gapiToken=null;

function ensureGisScript(){
  return new Promise((resolve,reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2)return resolve();
    let sc=document.getElementById("gis-script");
    if(!sc){
      sc=document.createElement("script");
      sc.id="gis-script";
      sc.src="https://accounts.google.com/gsi/client";
      sc.async=true;
      sc.defer=true;
      document.head.appendChild(sc);
    }
    const start=Date.now();
    const iv=setInterval(()=>{
      if(window.google && window.google.accounts && window.google.accounts.oauth2){
        clearInterval(iv);
        resolve();
      }else if(Date.now()-start>8000){
        clearInterval(iv);
        reject(new Error("GIS timeout"));
      }
    },150);
  });
}

function saveDriveClientId(){
  const val=($("#f_gcid")&&$("#f_gcid").value||"").trim();
  if(!val)return toast("Saisis ton Client ID Google");
  S.gdriveClientId=val;
  save();
  const cfg=$("#gdrive-cfg");
  if(cfg)cfg.style.display="none";
  expDrive();
}

async function uploadWorkbookToDrive(token){
  const wb=buildWorkbook();
  const filename="Suivi_preparation_semi_marathon_23_mai_2027.xlsx";
  const xlsxBytes=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const blob=new Blob([xlsxBytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

  const q=encodeURIComponent("name = '"+filename+"' and trashed = false");
  const listRes=await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name)",{
    headers:{"Authorization":"Bearer "+token}
  });
  const listData=listRes.ok?await listRes.json():{files:[]};
  const existing=(listData.files&&listData.files[0])?listData.files[0]:null;

  const meta={
    name:filename,
    mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  };
  const form=new FormData();
  form.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));
  form.append("file",blob);

  const url=existing
    ?"https://www.googleapis.com/upload/drive/v3/files/"+encodeURIComponent(existing.id)+"?uploadType=multipart"
    :"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
  const method=existing?"PATCH":"POST";

  const upRes=await fetch(url,{
    method,
    headers:{"Authorization":"Bearer "+token},
    body:form
  });
  if(!upRes.ok)throw new Error("Drive upload failed");
  toast(existing?"Mis à jour sur Google Drive":"Envoyé sur Google Drive");
}

async function expDrive(){
  try{
    if(typeof XLSX=="undefined")return toast("Bibliothèque Excel non chargée");
    const clientId=(S.gdriveClientId||"").trim();
    if(!clientId){
      const cfg=$("#gdrive-cfg");
      if(cfg){
        cfg.style.display=cfg.style.display==="none"?"block":"none";
        if(cfg.style.display==="block"&&$("#f_gcid"))$("#f_gcid").focus();
      }
      return toast("Ajoute ton Client ID Google Drive");
    }
    if(gapiToken){
      try{
        await uploadWorkbookToDrive(gapiToken);
        return;
      }catch(e){
        gapiToken=null;
      }
    }
    toast("Connexion à Google Drive…");
    await ensureGisScript();
    const tokenClient=window.google.accounts.oauth2.initTokenClient({
      client_id:clientId,
      scope:"https://www.googleapis.com/auth/drive.file",
      callback:async(resp)=>{
        if(resp && resp.access_token){
          gapiToken=resp.access_token;
          try{
            await uploadWorkbookToDrive(gapiToken);
          }catch(err){
            toast("Échec de l’envoi Google Drive");
          }
        }else{
          toast("Connexion Google annulée");
        }
      }
    });
    tokenClient.requestAccessToken({prompt:""});
  }catch(e){
    toast("Google Drive indisponible ici");
  }
}

cloud();
